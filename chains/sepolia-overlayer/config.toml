rpc_url = "https://ethereum-sepolia-rpc.publicnode.com"
chain_id = 11155111
explorer = "https://sepolia.etherscan.io"
symbol = "ETH"
tps = 10
worker_amount = 5

# Custom wallet directory for sepolia wallets
wallet_dir = "chains/sepolia-overlayer/wallets-json-sepolia-overlayer"

# Optional: min and max delay between transactions (in milliseconds)
# For sepolia: random 5-15 seconds between tasks
min_delay_ms = 5000
max_delay_ms = 15000

# Timeout for one daily task attempt, in seconds
task_timeout_secs = 120

# Optional: Proxies (or use proxies.txt in root)
# [[proxies]]
# url = "http://proxy1:port"
# username = "user"
# password = "pass"

# ── Daily Runner — Per-Task Limits ─────────────────────────────────────
# Uncomment and set daily limits per task. Default = 1 for unlisted tasks.
# The daily runner will execute each task up to this many times per wallet
# per day. Failed executions do NOT count toward the limit.
#
# To see all 19 task names: chains/sepolia-overlayer/src/task/
#
[task_limits]
01_checkbalance = 2
02_mintusdtplus = 10
03_mintusdcplus = 10
04_redeemusdtplus = 2
05_redeemusdcplus = 2
06_stakeusdtplus = 5
07_stakeusdcplus = 5
08_unstaketplus = 1
09_unstakecplus = 1
10_aaveusdtfaucet = 3
11_aaveusdcfaucet = 3
12_bridgetplus = 1
13_bridgecplus = 1
14_sendrandomusdtplus = 2
15_sendrandomusdcplus = 1
16_bridgebacktplus = 1
17_bridgebackcplus = 1
18_receivetplus = 1
19_receivecplus = 1
20_aavewbtcfaucet = 3


# Command to Run
# cargo run -p sepolia-overlayer --bin sepolia-daily -- --config chains/sepolia-overlayer/config.toml --base-config chains/sepolia-overlayer/config-base.toml
